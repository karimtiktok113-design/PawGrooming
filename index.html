    <script>
      (function() {
        function isBenignAbort(msg, err) {
          if (!msg && !err) return false;
          var str = (String(msg || '') + ' ' + String(err && err.message ? err.message : '') + ' ' + String(err && err.name ? err.name : '') + ' ' + String(err || '')).toLowerCase();
          return (
            str.indexOf('signal is aborted without reason') !== -1 ||
            str.indexOf('the user aborted a request') !== -1 ||
            str.indexOf('aborterror') !== -1 ||
            str.indexOf('aborted') !== -1
          );
        }

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (isBenignAbort(typeof arg === 'string' ? arg : '', arg)) {
              if (console.debug) console.debug.apply(console, arguments);
              return;
            }
          }
          return origError.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event ? event.reason : null;
          if (isBenignAbort(reason && reason.message ? reason.message : '', reason)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.stopPropagation) event.stopPropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isBenignAbort(event.message, event.error)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.stopPropagation) event.stopPropagation();
          }
        }, true);

        window.onunhandledrejection = function(event) {
          var reason = event ? event.reason : null;
          if (isBenignAbort(reason && reason.message ? reason.message : '', reason)) {
            if (event && event.preventDefault) event.preventDefault();
            return true;
          }
        };

        window.onerror = function(message, source, lineno, colno, error) {
          if (isBenignAbort(message, error)) {
            return true;
          }
        };
      })();
    </script>
